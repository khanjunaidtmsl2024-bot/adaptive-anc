name: DRDO Adaptive ANC Master CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Test & 20-Experiment Verification
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install System Audio Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 libsndfile1-dev libportaudio2 || true
        sudo apt-get install -y libasound2-dev || sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Verify Canonical Environment & Dependencies
      run: |
        python -c "import matplotlib, numpy, scipy, soundfile, pystoi, pesq, numba, yaml, torch; print('Canonical CI environment verified: all core modules present.')"

    - name: Run Unit Test Suite
      run: |
        pytest -v tests/

    - name: Run 20 Mandatory Experiments Suite
      run: |
        python experiments/scripts/run_all_experiments.py

    - name: Run 14-Step Hardware Bring-Up Verification
      run: |
        python hardware/verify_hardware_bringup.py

    - name: Run Edge Model Export & Optimization
      run: |
        python main.py export-edge

    - name: Run ichigo137/anc Bridge Audit
      run: |
        python main.py ichigo-bridge
